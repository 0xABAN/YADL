<!doctype html>
<meta charset="utf-8">
<title>Imigen</title>
<style>
  :root { --bg:#111; --panel:#181818; --line:#2a2a2a; --text:#ececec; --muted:#8a8a8a; --accent:#7c5cff }
  * { box-sizing:border-box; margin:0 }
  html,body { height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,sans-serif }
  body { display:grid; grid-template:48px 1fr / 220px 1fr }
  header { grid-column:1/-1; display:grid; grid-template-columns:220px 1fr auto; align-items:center; border-bottom:1px solid var(--line); padding:0 12px }
  header > span { font-weight:600 }
  nav { justify-self:center; display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:999px; padding:4px 10px }
  nav span { min-width:3.5em; text-align:center; color:var(--muted) }
  button { background:transparent; color:var(--text); border:0; cursor:pointer; font:inherit }
  nav button { color:var(--muted); padding:2px 6px }
  nav button:disabled { opacity:.35; cursor:default }
  header > button { background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font-weight:600 }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px }
  h1 { font-size:13px; font-weight:600; padding-bottom:8px; border-bottom:2px solid var(--accent); display:inline-block }
  main { display:grid; place-items:center }
  svg { width:min(52vh,360px); overflow:visible }
  svg line { stroke:#c8c4ff; stroke-width:3; stroke-linecap:round }
  svg circle { fill:#fff }
</style>
<header>
  <span>Imigen</span>
  <nav>
    <button type="button" disabled>&lt;</button>
    <span>0 / 0</span>
    <button type="button" disabled>&gt;</button>
  </nav>
  <button type="button">Commit</button>
</header>
<aside>
  <h1>Classes</h1>
</aside>
<main>

  <svg viewBox="0 0 200 260">
    <line x1="100" y1="230" x2="48" y2="170"/><line x1="48" y1="170" x2="28" y2="130"/><line x1="28" y1="130" x2="18" y2="100"/><line x1="18" y1="100" x2="12" y2="72"/>
    <line x1="100" y1="230" x2="78" y2="120"/><line x1="78" y1="120" x2="72" y2="78"/><line x1="72" y1="78" x2="70" y2="48"/><line x1="70" y1="48" x2="68" y2="22"/>
    <line x1="100" y1="230" x2="100" y2="118"/><line x1="100" y1="118" x2="100" y2="72"/><line x1="100" y1="72" x2="100" y2="40"/><line x1="100" y1="40" x2="100" y2="12"/>
    <line x1="100" y1="230" x2="122" y2="122"/><line x1="122" y1="122" x2="128" y2="80"/><line x1="128" y1="80" x2="132" y2="52"/><line x1="132" y1="52" x2="134" y2="28"/>
